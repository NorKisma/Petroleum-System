<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Advanced POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            color: white;
            animation: fadeIn 0.6s ease-out;
        }

        .icon-box {
            width: 70px;
            height: 70px;
            background: rgba(59, 130, 246, 0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: #4ba3e3;
            font-size: 1.8rem;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            padding: 12px 20px;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #4ba3e3;
            color: white;
            box-shadow: none;
        }

        .btn-reset {
            background: #4ba3e3;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 700;
            width: 100%;
            margin-top: 20px;
            transition: 0.3s;
        }

        .btn-reset:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="glass-card shadow-lg text-center">
    <div class="icon-box">
        <i class="fas fa-lock-open"></i>
    </div>
    <h3 class="fw-bold mb-1">New Password</h3>
    <p class="text-white small mb-4">Verification successful! Please set a strong new password for your account.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} bg-{{ category }} border-0 text-white small py-2 mb-3">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.reset_password', email=email, token=token) }}">
        <div class="mb-3 text-start">
            <label class="text-white small ms-2 mb-1">New Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required autofocus>
        </div>

        <div class="mb-3 text-start">
            <label class="text-white small ms-2 mb-1">Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-reset">
            RESET PASSWORD <i class="fas fa-save ms-2"></i>
        </button>
    </form>
</div>

</body>
</html>
