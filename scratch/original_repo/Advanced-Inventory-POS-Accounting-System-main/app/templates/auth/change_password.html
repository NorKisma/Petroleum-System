{% extends 'layouts/base.html' %}

{% block title %}Change Password - Rays Tech Center{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-lg rounded-4 animate-up">
                <div class="card-header bg-white border-0 pt-4 text-center">
                    <div class="mb-3">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 rounded-circle" style="width: 60px; height: 60px;">
                            <i class="fas fa-key text-primary fa-2x"></i>
                        </div>
                    </div>
                    <h4 class="fw-bold text-dark">Change Password</h4>
                    <p class="text-muted small">Hubi nabadgelyadaada adigoo cusboonaysiinaya password-kaaga.</p>
                </div>
                <div class="card-body p-4 pt-2">
                    <form action="{{ url_for('auth.change_password') }}" method="POST">
                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted small text-uppercase" style="letter-spacing: 0.5px;">Current Password</label>
                            <div class="input-group border-bottom border-light pb-2">
                                <span class="input-group-text bg-transparent border-0 p-0 me-3 text-muted">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" name="old_password" class="form-control border-0 shadow-none p-0" placeholder="Password-kii hore" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted small text-uppercase" style="letter-spacing: 0.5px;">New Password</label>
                            <div class="input-group border-bottom border-light pb-2">
                                <span class="input-group-text bg-transparent border-0 p-0 me-3 text-muted">
                                    <i class="fas fa-shield-alt"></i>
                                </span>
                                <input type="password" name="new_password" class="form-control border-0 shadow-none p-0" placeholder="Password cusub" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted small text-uppercase" style="letter-spacing: 0.5px;">Confirm New Password</label>
                            <div class="input-group border-bottom border-light pb-2">
                                <span class="input-group-text bg-transparent border-0 p-0 me-3 text-muted">
                                    <i class="fas fa-check-double"></i>
                                </span>
                                <input type="password" name="confirm_password" class="form-control border-0 shadow-none p-0" placeholder="Ku celi password-ka" required>
                            </div>
                        </div>

                        <div class="d-grid mt-5">
                            <button type="submit" class="btn btn-primary py-3 fw-bold rounded-3 shadow-sm btn-hover-scale">
                                <i class="fas fa-save me-2"></i> Update Password
                            </button>
                        </div>
                        
                        <div class="text-center mt-3">
                            <a href="{{ url_for('main.dashboard') }}" class="text-decoration-none text-muted small">
                                <i class="fas fa-arrow-left me-1"></i> Dib ugu noqo Dashboard
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .btn-hover-scale {
        transition: transform 0.2s;
    }
    .btn-hover-scale:hover {
        transform: scale(1.02);
    }
    input::placeholder {
        font-size: 0.9rem;
        opacity: 0.5;
    }
</style>
{% endblock %}
